<!DOCTYPE html>
<html>

<head>
<title>Node.js Events</title>

<style>

body{
font-family:Arial;
background:#f4f7ff;
text-align:center;
margin-top:80px;
}

.container{
background:white;
width:450px;
margin:auto;
padding:35px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
color:#4a6cf7;
}

p{
color:#555;
line-height:1.6;
}

button{
background:#4a6cf7;
color:white;
border:none;
padding:12px 25px;
font-size:16px;
border-radius:6px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#324ecf;
}

</style>

</head>

<body>

<div class="container">

<h1>Node.js Event Driven Programming</h1>

<p>
This application demonstrates custom events using the EventEmitter class in Node.js.
</p>

<p>
Click the button below to trigger an event.
</p>

<a href="/login">
<button>Trigger Login Event</button>
</a>

</div>

</body>

</html>
