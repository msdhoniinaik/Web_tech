<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e4ed8;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #f1f5f9;
            border-radius: 5px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Marks</h2>

    <label>Name</label>
    <input type="text" id="name">

    <label>Mark 1</label>
    <input type="number" id="m1">

    <label>Mark 2</label>
    <input type="number" id="m2">

    <label>Mark 3</label>
    <input type="number" id="m3">

    <button onclick="calculate()">Calculate</button>

    <!-- ✅ OUTPUT AREA -->
    <div class="result" id="result"></div>
</div>

<script src="script1.js"></script>

</body>
</html>
